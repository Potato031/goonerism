name: Build Multi-Platform Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'

      - name: Build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --config Release

      - name: Package Windows
        run: |
          cd build/Release
          windeployqt --multimedia PotatoEditor.exe
          
          Get-ChildItem -Path "${{ github.workspace }}" -Filter "ffmpeg.exe" -Recurse | Where-Object { $_.FullName -notlike "*build*" } | Copy-Item -Destination "." -Force
          
          Compress-Archive -Path * -DestinationPath ../../PotatoEditor_windows.zip

      - name: Upload Windows Release
        uses: softprops/action-gh-release@v2
        with:
          files: PotatoEditor_windows.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libpulse-dev libasound2-dev \
          libxcb-cursor0 \
          ffmpeg patchelf desktop-file-utils

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          target: 'desktop'
          modules: 'qtmultimedia'

      - name: Build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2

      - name: Verify release version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          header = pathlib.Path('src/Includes/mainWindow.h').read_text()
          version = re.search(r'CURRENT_VERSION\s*=\s*"([^"]+)"', header).group(1)
          cmake = pathlib.Path('CMakeLists.txt').read_text()
          project_version = re.search(r'project\(SimpleVideoEditor VERSION ([^\)]+)\)', cmake).group(1)
          assert project_version == version, 'CMake and header versions must match'
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and header version must match'
          PY

      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux (AppImage)
        env:
          APPIMAGE_VERSION: ${{ github.ref_name }}
        run: bash scripts/package-appimage.sh "$PWD/build" "$PWD/appimage-build"

      - name: Upload Linux Release
        uses: softprops/action-gh-release@v2
        with:
          files: appimage-build/potatoeditor.appimage
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
